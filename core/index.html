<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        
    </script>
    <meta charset="UTF-8">
    <title>Blank Page</title>
    <style>
      body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
        }
        iframe {
            border: 0; /* No border */
            position: fixed;
            bottom: 0; /* Positioned at the bottom */
            right: 0; /* Positioned on the right */
            width: 500px; /* Set to the width of the chat UI */
            height: 500px; /* Set to the height of the chat UI */
            background: transparent !important; /* Ensures no background color */
            z-index: 1000; /* High z-index to ensure it's above other content */
        }
    </style>
</head>
<body>
    <div id="main-content">
        <!-- Main content will be dynamically loaded and updated here -->
    </div>
    <iframe id="chat-frame" src="chat.html" frameborder="0" allowtransparency="true"></iframe>

    <script>
        // WebSocket connection to handle dynamic updates
        const ws = new WebSocket('ws://localhost:3000');
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'update-html') {
                const mainContent = document.getElementById('main-content');
                mainContent.innerHTML = ''; // Clear existing content
                insertAndExecuteScripts(mainContent, data.html);
            }
        };

        function insertAndExecuteScripts(container, htmlString) {
    // Temporary container for the incoming HTML
    const tempContainer = document.createElement('div');
    tempContainer.innerHTML = htmlString;

    // Move non-script elements to the real container
    Array.from(tempContainer.childNodes).forEach(node => {
        if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'SCRIPT') {
            container.appendChild(node.cloneNode(true));
        }
    });

    // Handle and execute scripts
    const scripts = tempContainer.querySelectorAll('script');
    scripts.forEach(script => {
        const newScript = document.createElement('script');
        if (script.src) {
            newScript.src = script.src;
            newScript.onload = () => console.log('Loaded external script:', script.src);
            newScript.onerror = () => console.log('Error loading script:', script.src);
        } else {
            newScript.textContent = script.textContent;
        }
        document.body.appendChild(newScript).parentNode.removeChild(newScript);
    });
}

        // Initial load of chat.html and main.html
        document.addEventListener('DOMContentLoaded', function() {
            /*
            fetch('chat.html')
                .then(response => response.text())
                .then(html => {
                    const chatContainer = document.getElementById('chat-container');
                    chatContainer.innerHTML = html;
                    initializeChat()
                });
                */
            fetch('main.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('main-content').innerHTML = html;
                });
        });
    </script>
</body>
</html>
